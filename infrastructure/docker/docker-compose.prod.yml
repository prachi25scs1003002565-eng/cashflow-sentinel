services:
  postgres:
    image: postgres:16-alpine
    container_name: cashflow-sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cashflow_sentinel}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-cashflow_sentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cashflow-network

  ai-engine:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.ai
    container_name: cashflow-sentinel-ai
    restart: unless-stopped
    environment:
      AI_ENGINE_HOST: 0.0.0.0
      AI_ENGINE_PORT: 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cashflow-network

  backend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: cashflow-sentinel-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-cashflow_sentinel}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:5000/api/v1}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:80}
      AI_ENGINE_URL: http://ai-engine:8000
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - cashflow-network

  frontend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api/v1}
    container_name: cashflow-sentinel-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - cashflow-network

volumes:
  postgres_data:
    driver: local

networks:
  cashflow-network:
    driver: bridge
